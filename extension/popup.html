<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Application Autofill AI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 14px;
      width: 380px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      padding: 14px;
      border-radius: 12px;
    }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .subtitle {
      margin: 6px 0 0 0;
      font-size: 12px;
      opacity: 0.95;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .primary-btn,
    .secondary-btn,
    .insert-btn {
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .primary-btn,
    .secondary-btn {
      flex: 1;
      padding: 10px 12px;
      font-size: 13px;
    }

    .primary-btn {
      background: #2563eb;
      color: white;
    }

    .primary-btn:hover {
      background: #1d4ed8;
    }

    .secondary-btn {
      background: #e5e7eb;
      color: #111827;
    }

    .secondary-btn:hover {
      background: #d1d5db;
    }

    .status {
      font-size: 12px;
      color: #4b5563;
      background: white;
      border: 1px solid #e5e7eb;
      padding: 10px 12px;
      border-radius: 10px;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .field-item {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .field-label {
      font-size: 13px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .field-answer {
      font-size: 12px;
      line-height: 1.55;
      color: #374151;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }

    .insert-btn {
      width: auto;
      padding: 8px 12px;
      background: #111827;
      color: white;
      font-size: 12px;
    }

    .insert-btn:hover {
      background: #000000;
    }

    .insert-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .empty-state {
      background: white;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      font-size: 12px;
      color: #6b7280;
    }

    .results::-webkit-scrollbar {
      width: 8px;
    }

    .results::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }

    .results::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2 class="title">Application Autofill AI</h2>
      <p class="subtitle">Scan startup application forms, generate answers, and insert them faster.</p>
    </div>

    <div class="actions">
      <button id="scanBtn" class="primary-btn">Scan Form</button>
      <button id="insertAllBtn" class="secondary-btn" style="display: none;">Insert All</button>
    </div>

    <div id="status" class="status">Ready to scan the current page.</div>

    <div id="results" class="results">
      <div class="empty-state">
        No answers yet. Click <strong>Scan Form</strong> to begin.
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
